[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kv-cache-quality-benchmark"
version = "0.1.0"
description = "Measure behavioral fidelity across llama.cpp KV-cache formats"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["fastapi>=0.115", "httpx>=0.27", "psutil>=6", "pydantic>=2.8", "typer>=0.12", "uvicorn>=0.30", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
kv-cache-quality-benchmark = "kv_cache_quality_benchmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kv_cache_quality_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/kv_cache_quality_benchmark/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
